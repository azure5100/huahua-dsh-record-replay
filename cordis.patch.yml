# huahua-dsh-record-replay bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the dsh.bundle.patch
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:<this-repo>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (session scanning, replay-pack store, /api/huahua-dsh-record-replay
# routes, the system-prompt announcement), and the dsh.client declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/huahua-dsh-record-replay/client.js) load in the web GUI.
- insert:
    - id: record-replay
      name: 'huahua-dsh-record-replay'
